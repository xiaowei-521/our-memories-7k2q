<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>💌 我有个秘密想告诉你</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: radial-gradient(120% 100% at 50% 110%, #46102f 0%, #210714 45%, #0d0209 100%);
    color: #ffeef4;
    user-select: none;
  }
  canvas#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  .scene {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    animation: fadeIn .9s ease both;
  }
  .hidden { display: none !important; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .grad {
    background: linear-gradient(120deg, #ffd1dc, #ff5c8a 45%, #ff2e63);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ── 开场 ── */
  .envelope {
    font-size: clamp(64px, 14vw, 110px);
    animation: floaty 3.2s ease-in-out infinite;
    filter: drop-shadow(0 0 26px rgba(255, 92, 138, .55));
  }
  @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
  .start-title { font-size: clamp(26px, 6vw, 44px); font-weight: 700; margin: 18px 0 10px; }
  .sub { color: #ffd6e2; line-height: 1.9; margin-bottom: 30px; font-size: clamp(14px, 2.4vw, 17px); }

  /* ── 按钮 ── */
  .btn {
    border: none; cursor: pointer; font-family: inherit;
    font-size: clamp(16px, 2.6vw, 20px); padding: 14px 34px; border-radius: 999px;
    transition: transform .25s ease, box-shadow .25s ease, opacity .35s;
  }
  .btn:focus { outline: none; }
  .btn-primary {
    background: linear-gradient(135deg, #ff5c8a, #ff2e63); color: #fff;
    box-shadow: 0 6px 30px rgba(255, 46, 99, .45);
    transform: scale(var(--s, 1));
  }
  .btn-primary:hover { transform: scale(calc(var(--s, 1) * 1.07)); box-shadow: 0 6px 42px rgba(255, 46, 99, .68); }
  .btn-ghost {
    background: rgba(255, 255, 255, .08); color: #ffc2d1;
    border: 1px solid rgba(255, 143, 171, .4);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transform: scale(var(--s, 1));
  }
  .btn-row { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; align-items: center; margin-top: 6px; }
  #btn-no.dodging {
    position: fixed; z-index: 6; margin: 0;
    transition: left .32s cubic-bezier(.22, .9, .36, 1.15), top .32s cubic-bezier(.22, .9, .36, 1.15),
                transform .25s ease, opacity .35s ease;
  }
  .small-btn { font-size: 14px; padding: 10px 22px; margin-top: 26px; }
  .tiny { margin-top: 18px; color: rgba(255, 190, 208, .62); font-size: 13px; letter-spacing: 1px; }

  /* ── 回忆相册 ── */
  .mem-title { font-size: clamp(24px, 5.5vw, 40px); font-weight: 700; margin-bottom: 6px; }
  .card-stack { position: relative; width: min(86vw, 420px); height: min(60vh, 540px); margin: 16px 0 10px; }
  .card-stack:empty { display: none; }
  .mem-card {
    position: absolute; left: 50%; top: 50%;
    background: linear-gradient(160deg, #fffafc, #ffeef4);
    border-radius: 10px; padding: 14px 14px 16px;
    box-shadow: 0 16px 44px rgba(0, 0, 0, .5), 0 3px 10px rgba(0, 0, 0, .3);
    cursor: pointer; will-change: transform;
    transition: transform .6s cubic-bezier(.22, .9, .32, 1.05), opacity .55s ease;
  }
  .mem-card img { display: block; max-width: min(74vw, 330px); max-height: 44vh; margin: 0 auto; border-radius: 4px; }
  .mem-card.gone { pointer-events: none; z-index: 300 !important; }
  .tape {
    position: absolute; top: -13px; left: 50%;
    transform: translateX(-50%) rotate(-4deg);
    background: rgba(255, 143, 171, .78);
    color: #fff; font-size: 13px; letter-spacing: 4px; text-indent: 4px;
    padding: 4px 18px; border-radius: 3px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .18);
    font-family: "KaiTi", "STKaiti", serif;
  }
  .mem-caption {
    margin-top: 12px; text-align: center;
    font-family: "KaiTi", "STKaiti", "Kaiti SC", serif;
    font-size: clamp(15px, 2.4vw, 18px); color: #8a4a5e; line-height: 1.6;
    max-width: min(74vw, 330px);
  }
  .dots { display: flex; gap: 9px; justify-content: center; margin-top: 2px; }
  .dots.hidden { display: none; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 143, 171, .3); transition: background .3s, box-shadow .3s; }
  .dots span.on { background: #ff5c8a; box-shadow: 0 0 10px rgba(255, 92, 138, .8); }
  #mem-end { animation: fadeIn .9s ease both; }
  .mem-end-line {
    color: #ffd6e2; font-size: clamp(15px, 2.6vw, 18px); margin: 12px 0 22px;
    font-family: "KaiTi", "STKaiti", serif;
  }

  /* ── 照片放大镜按钮 ── */
  .zoom-btn {
    position: absolute; top: 10px; right: 10px;
    width: 34px; height: 34px; border-radius: 50%; padding: 0;
    border: 1px solid rgba(255, 143, 171, .55);
    background: rgba(255, 92, 138, .3);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    cursor: zoom-in;
    box-shadow: 0 3px 12px rgba(0, 0, 0, .25);
    transition: transform .25s, background .25s, box-shadow .25s;
  }
  .zoom-btn:hover {
    transform: scale(1.14);
    background: rgba(255, 92, 138, .55);
    box-shadow: 0 4px 18px rgba(255, 92, 138, .55);
  }
  .zoom-btn:focus { outline: none; }
  .zoom-btn svg { display: block; }

  /* ── 大图灯箱 ── */
  .lightbox {
    position: fixed; inset: 0; z-index: 400;
    background: rgba(10, 2, 7, .84);
    -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: fadeIn .3s ease;
  }
  .lightbox.hidden { display: none; }
  .lb-body {
    max-width: 94vw; max-height: calc(100vh - 132px);
    overflow: auto; border-radius: 8px;
    box-shadow: 0 20px 80px rgba(0, 0, 0, .65);
    animation: lbPop .35s cubic-bezier(.22, .9, .3, 1.1) both;
    -webkit-overflow-scrolling: touch;
  }
  @keyframes lbPop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .lb-body img { display: block; max-width: 92vw; max-height: calc(100vh - 132px); border-radius: 8px; }
  .lightbox:not(.zoomed) .lb-body img { cursor: zoom-in; }
  .lightbox.zoomed .lb-body img { cursor: zoom-out; }
  .lightbox.zoomed .lb-body { max-height: calc(100vh - 132px); }
  .lightbox.zoomed .lb-body img { max-width: none; max-height: none; width: min(96vw, 880px); height: auto; }
  .lb-cap {
    margin-top: 13px; text-align: center; max-width: 88vw;
    color: #ffd6e2; font-family: "KaiTi", "STKaiti", serif;
    font-size: clamp(15px, 2.4vw, 17px); line-height: 1.7;
  }
  .lb-toggle {
    margin-top: 12px; padding: 9px 22px; border-radius: 999px;
    border: 1px solid rgba(255, 143, 171, .45);
    background: rgba(255, 92, 138, .16); color: #ffc2d1;
    font-family: inherit; font-size: 14px; letter-spacing: 1px; cursor: pointer;
    transition: background .25s, transform .25s;
  }
  .lb-toggle:hover { background: rgba(255, 92, 138, .35); transform: scale(1.05); }
  .lb-close {
    position: absolute; top: 18px; right: 18px;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid rgba(255, 143, 171, .4);
    background: rgba(255, 255, 255, .08); color: #ffd6e2;
    font-size: 17px; cursor: pointer; line-height: 1;
    transition: transform .25s, background .25s;
  }
  .lb-close:hover { transform: rotate(90deg); background: rgba(255, 92, 138, .4); }

  /* ── 人像画廊 ── */
  .gal-title { font-size: clamp(24px, 5.5vw, 40px); font-weight: 700; margin-bottom: 4px; }
  .gal-sub { margin-bottom: 16px; }
  .gal-frame { display: flex; align-items: center; gap: 10px; }
  .gal-stage {
    width: min(62vw, 330px); height: min(48vh, 450px);
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px; overflow: hidden; position: relative;
    background: rgba(255, 255, 255, .04);
    border: 1px solid rgba(255, 143, 171, .25);
    box-shadow: 0 18px 60px rgba(0, 0, 0, .5);
    cursor: zoom-in;
  }
  .gal-stage img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    transition: opacity .45s ease, transform .45s ease;
  }
  .gal-stage img.fading { opacity: 0; transform: scale(.97); }
  .gal-arrow {
    width: 44px; height: 44px; border-radius: 50%; flex: none;
    border: 1px solid rgba(255, 143, 171, .4);
    background: rgba(255, 255, 255, .07); color: #ffd6e2;
    font-size: 22px; line-height: 1; cursor: pointer; font-family: inherit;
    transition: transform .25s, background .25s;
  }
  .gal-arrow:hover { transform: scale(1.12); background: rgba(255, 92, 138, .35); }
  .gal-arrow:focus { outline: none; }
  .gal-cap {
    margin-top: 14px; min-height: 32px; max-width: 86vw; text-align: center;
    font-family: "KaiTi", "STKaiti", "Kaiti SC", serif;
    font-size: clamp(16px, 2.8vw, 20px); color: #ffd6e2;
    transition: opacity .45s ease;
  }
  .gal-done { margin-top: 14px; animation: fadeIn .9s ease both; }
  .gal-skip {
    margin-top: 16px; padding: 9px 20px; border-radius: 999px;
    border: 1px solid rgba(255, 143, 171, .35); background: transparent;
    color: rgba(255, 194, 209, .75); font-family: inherit;
    font-size: 13.5px; letter-spacing: 1px; cursor: pointer;
    transition: color .25s, border-color .25s;
  }
  .gal-skip:hover { color: #ffd6e2; border-color: rgba(255, 143, 171, .7); }
  .gal-skip.hidden { display: none; }

  /* ── 信 ── */
  .letter-card {
    width: min(86vw, 620px); max-height: 56vh; overflow-y: auto;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 143, 171, .25);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-radius: 18px; padding: 28px 26px;
    font-family: "KaiTi", "STKaiti", "Kaiti SC", "BiauKai", serif;
    font-size: clamp(17px, 2.6vw, 21px); line-height: 2.1;
    color: #ffe6ee; text-align: left; cursor: pointer;
  }
  .cursor { display: inline-block; color: #ff8fab; margin-left: 2px; animation: blink .85s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── 提问 ── */
  .small-pink { color: #ffb3c6; font-size: clamp(14px, 2.2vw, 18px); letter-spacing: 2px; }
  .days-num {
    font-size: clamp(64px, 16vw, 120px); font-weight: 800; line-height: 1.15;
    text-shadow: 0 0 40px rgba(255, 46, 99, .35);
  }
  .question { font-size: clamp(28px, 7vw, 54px); font-weight: 800; margin: .45em 0 1.1em; }

  /* ── 结局 ── */
  .big-heart {
    font-size: clamp(76px, 17vw, 130px);
    animation: beat 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 34px rgba(255, 46, 99, .6));
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); } 14% { transform: scale(1.18); } 28% { transform: scale(1); }
    42% { transform: scale(1.12); } 56% { transform: scale(1); }
  }
  .final-title { font-size: clamp(34px, 8vw, 58px); font-weight: 800; margin: 10px 0 8px; }
  .final-sub { color: #ffd6e2; line-height: 2; margin-bottom: 14px; font-size: clamp(14px, 2.4vw, 17px); }
  .together {
    margin: 16px 0 6px; padding: 10px 22px; border-radius: 999px;
    border: 1px solid rgba(255, 143, 171, .3); background: rgba(255, 92, 138, .1);
    color: #ffd1dc; font-size: clamp(15px, 2.4vw, 19px); letter-spacing: 1px;
  }
  .memorial { margin: 8px 0 0; color: #ffb3c6; font-size: clamp(13px, 2vw, 15px); }
  .sign { margin-top: 16px; font-family: "KaiTi", "STKaiti", serif; font-size: 20px; color: #ffc2d1; }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- 第一幕 · 开场 -->
<div id="scene-start" class="scene hidden">
  <div class="envelope">💌</div>
  <h1 class="grad start-title">我有个秘密想告诉你</h1>
  <p class="sub">亲爱的 <span data-name></span>，请你给我一分钟——<br>剩下的话，都藏在这个小页面里 🎁</p>
  <button id="btn-open" class="btn btn-primary">轻轻点开</button>
  <p id="sound-hint" class="tiny">🔊 打开声音体验更佳</p>
</div>

<!-- 第二幕 · 回忆相册 -->
<div id="scene-memories" class="scene hidden">
  <h1 class="grad mem-title">我们的点点滴滴 ✨</h1>
  <p class="sub" id="mem-hint">点一点照片，把回忆一张张翻开——<br>这些都是我们互相喜欢的痕迹</p>
  <div class="card-stack" id="card-stack"></div>
  <div class="dots" id="mem-dots"></div>
  <div id="mem-end" class="hidden">
    <p class="mem-end-line">截图到这里就完了，可我们的故事才刚刚开始</p>
    <button id="btn-to-gallery" class="btn btn-primary">接着看，我眼里的你 →</button>
  </div>
</div>

<!-- 第三幕 · 人像画廊 -->
<div id="scene-gallery" class="scene hidden">
  <h1 class="grad gal-title">每一个阶段的你</h1>
  <p class="sub gal-sub">都是我最喜欢的样子</p>
  <div class="gal-frame">
    <button id="gal-prev" class="gal-arrow" title="上一张">‹</button>
    <div class="gal-stage" id="gal-stage"><img id="gal-img" alt="你"></div>
    <button id="gal-next" class="gal-arrow" title="下一张">›</button>
  </div>
  <p class="gal-cap" id="gal-cap"></p>
  <div class="dots" id="gal-dots"></div>
  <button id="btn-gal-done" class="btn btn-primary gal-done hidden">写给你的信 💌</button>
  <button id="btn-gal-skip" class="gal-skip">跳过，直接去看信 ›</button>
</div>

<!-- 第四幕 · 信 -->
<div id="scene-letter" class="scene hidden">
  <div class="letter-card" id="letter-card">
    <span id="letter-text"></span>
  </div>
  <p id="type-skip" class="tiny">✎ 等不及的话，点一下信纸可以跳过打字</p>
  <button id="btn-next" class="btn btn-primary hidden">我看完啦，然后呢 ↓</button>
</div>

<!-- 第五幕 · 提问 -->
<div id="scene-question" class="scene hidden">
  <p class="small-pink">认识你的第</p>
  <div class="days-num grad" id="days-num">0</div>
  <p class="small-pink" id="known-since"></p>
  <h1 class="question grad"><span data-name></span>，做我女朋友好吗？</h1>
  <div class="btn-row">
    <button id="btn-yes" class="btn btn-primary">我愿意 ❤</button>
    <button id="btn-no" class="btn btn-ghost">让我想想</button>
  </div>
  <p id="no-hint" class="tiny hidden">那个按钮已经认命了——真正的答案只有一个 😌</p>
</div>

<!-- 第六幕 · 礼成 -->
<div id="scene-final" class="scene hidden">
  <div class="big-heart">💗</div>
  <h1 class="grad final-title">答应啦 ——！</h1>
  <p class="final-sub">从这一刻起，你就是我的女朋友<br>往后的温柔和浪漫，全都给你 🌹</p>
  <div class="together" id="together"></div>
  <p class="memorial">💕 纪念时刻：<span id="mem-date"></span> 💕</p>
  <p class="sign" id="sign"></p>
  <button id="btn-replay" class="btn btn-ghost small-btn">↺ 重温这一刻</button>
</div>

<!-- 大图灯箱（点照片右上角放大镜弹出） -->
<div id="lightbox" class="lightbox hidden">
  <button id="lb-close" class="lb-close" title="关闭">✕</button>
  <div class="lb-body" id="lb-body"><img id="lb-img" alt="放大查看我们的回忆"></div>
  <div class="lb-cap" id="lb-cap"></div>
  <button id="lb-toggle" class="lb-toggle">🔍 放大看大图</button>
</div>

<audio id="bgm" loop preload="auto"></audio>
<noscript>请使用现代浏览器打开这个页面 💝</noscript>

<script>
/* ═══════════════ ★★★ 送出之前，先改这里 ★★★ ═══════════════ */
const CONFIG = {
  herName: "慧宝儿",          // ← 她的昵称
  sign: "—— 永远爱你的我",     // ← 结尾签名
  startDate: "2026-11-06",    // 你们认识的日子：2026 年 11 月 6 日，用来算「第 N 天」
  letter: [                   // ← 信的内容，一行一项，随便增删
    "亲爱的慧宝儿：",
    "不知道你有没有发现，",
    "自从遇见你，我的心就像死循环，",
    "扑通扑通，停不下来。",
    "我写过很多代码，改过很多 bug，",
    "但你是我唯一不想重构的答案。",
    "世界很大，可你笑起来的那个角落，",
    "是我唯一想停留的地方。",
    "所以今天，我想很认真地问你——"
  ],
  photos: [                   // ← 回忆相册：想加照片就照这个样子多加几行
    { src: "图1.jpg", tag: "开始", caption: "群聊里的欢声笑语，是我心动的开始" },
    { src: "图2.jpg", tag: "心动", caption: "备忘录里写下的每一件，我都会一一兑现" },
    { src: "图3.jpg", tag: "日常", caption: "你爱的那杯少冰无糖酸奶拿铁，「慧宝最爱」，我都记得" },
    { src: "图4.jpg", tag: "情话", caption: "「慧宝儿会弹钢琴么，为何每天都能拨动我的心弦」——写在奶茶备注里的话" }
  ],
  portraits: [                // ← 「每一个阶段的你」人像画廊
    { src: "人像3.jpg", caption: "扶着帽檐笑的你，是我见过最美的风景" },
    { src: "人像2.jpg", caption: "连搞怪都这么可爱的，全世界只有你" },
    { src: "人像4.jpg", caption: "软软糯糯的你，比满屋子的熊都可爱" },
    { src: "人像1.jpg", caption: "夜色里的你，比霓虹还耀眼" },
    { src: "人像5.jpg", caption: "安安静静的你，让整个世界都慢了下来" },
    { src: "人像6.jpg", caption: "最真实的你，就是我想守护的日常" },
    { src: "人像7.jpg", caption: "你笑起来的时候，我的世界都亮了" },
    { src: "人像8.jpg", caption: "黄色棉服的你，是我冬天里的小太阳" }
  ],
  bgm: "bgm.flac"             // 背景音乐：告白气球（放在同一文件夹；没有也能正常打开）
};
/* ═══════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
document.querySelectorAll('[data-name]').forEach(el => el.textContent = CONFIG.herName);
document.title = '💌 给' + CONFIG.herName + '的一点心意';
$('bgm').src = CONFIG.bgm;

/* ---------- 场景切换 ---------- */
const scenes = { start: $('scene-start'), memories: $('scene-memories'), gallery: $('scene-gallery'), letter: $('scene-letter'), question: $('scene-question'), final: $('scene-final') };
function showScene(name) { for (const k in scenes) scenes[k].classList.toggle('hidden', k !== name); }

/* ---------- 爱心画布 ---------- */
const canvas = $('bg'), ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

const COLORS = ['#ff2e63', '#ff5c8a', '#ff8fab', '#ffc2d1', '#ff4f79'];
function drawHeart(x, y, size, rot, alpha, color) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  const s = size / 30; ctx.scale(s, s);
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(0, 12);
  ctx.bezierCurveTo(-19, -3, -11, -19, 0, -8);
  ctx.bezierCurveTo(11, -19, 19, -3, 0, 12);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* 背景里缓缓上浮的爱心 */
const ambient = [];
function newAmbient(fromBottom) {
  return {
    x: Math.random() * W,
    y: fromBottom ? H + 40 : Math.random() * H,
    size: 10 + Math.random() * 18,
    vy: 0.25 + Math.random() * 0.75,
    amp: 14 + Math.random() * 26,
    phase: Math.random() * Math.PI * 2,
    phaseSpeed: 0.01 + Math.random() * 0.02,
    alpha: 0.15 + Math.random() * 0.4,
    color: COLORS[(Math.random() * COLORS.length) | 0],
    rot: (Math.random() - 0.5) * 0.6,
    vr: (Math.random() - 0.5) * 0.004
  };
}
(function initAmbient() {
  const n = Math.max(14, Math.min(36, Math.round(W * H / 40000)));
  for (let i = 0; i < n; i++) ambient.push(newAmbient(false));
})();

/* 爆开的爱心（点击 / 烟花 / 鼠标轨迹） */
const bursts = [];
function spawnBurst(x, y, n, power) {
  n = n || 14; power = power || 1;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (1.5 + Math.random() * 4.5) * power;
    bursts.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5, g: 0.07,
      size: 5 + Math.random() * 10, rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.2,
      life: 1, decay: 0.011 + Math.random() * 0.012,
      color: COLORS[(Math.random() * COLORS.length) | 0]
    });
  }
  if (bursts.length > 400) bursts.splice(0, bursts.length - 400);
}
function spawnTrail(x, y) {
  bursts.push({
    x: x, y: y, vx: (Math.random() - 0.5) * 0.6, vy: -0.4 - Math.random() * 0.5, g: 0,
    size: 5 + Math.random() * 6, rot: (Math.random() - 0.5) * 0.4, vr: (Math.random() - 0.5) * 0.1,
    life: 0.8, decay: 0.02, color: COLORS[(Math.random() * COLORS.length) | 0]
  });
}

(function tick() {
  ctx.clearRect(0, 0, W, H);
  for (const h of ambient) {
    h.y -= h.vy; h.phase += h.phaseSpeed; h.rot += h.vr;
    drawHeart(h.x + Math.sin(h.phase) * h.amp, h.y, h.size, h.rot, h.alpha, h.color);
    if (h.y < -50) Object.assign(h, newAmbient(true));
  }
  for (let i = bursts.length - 1; i >= 0; i--) {
    const p = bursts[i];
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
    if (p.life <= 0) { bursts.splice(i, 1); continue; }
    drawHeart(p.x, p.y, p.size, p.rot, p.life, p.color);
  }
  requestAnimationFrame(tick);
})();

/* 点哪儿，哪儿开花 */
document.addEventListener('pointerdown', e => spawnBurst(e.clientX, e.clientY, 10, 0.8));
/* 桌面端：鼠标拖出一串小爱心 */
if (matchMedia('(pointer:fine)').matches) {
  let lastTrail = 0;
  document.addEventListener('pointermove', e => {
    const t = performance.now();
    if (t - lastTrail < 80) return; lastTrail = t;
    spawnTrail(e.clientX, e.clientY);
  });
}

/* ---------- 音乐 ---------- */
let bgmTried = false;
function playBgm() {
  if (bgmTried) return; bgmTried = true;
  const bgmEl = $('bgm');
  bgmEl.volume = 0.5;
  bgmEl.play().catch(() => {});
}
$('bgm').addEventListener('error', () => $('sound-hint').classList.add('hidden'));

/* ---------- 打字机 ---------- */
const letterEl = $('letter-text'), letterCard = $('letter-card');
const fullText = CONFIG.letter.join('\n');
let typeIdx = 0, typeTimer = null, typingDone = false;
function renderLetter() {
  const cur = typingDone ? '' : '<span class="cursor">▌</span>';
  letterEl.innerHTML = fullText.slice(0, typeIdx).replace(/\n/g, '<br>') + cur;
  letterCard.scrollTop = letterCard.scrollHeight;
}
function typeNext() {
  if (typeIdx >= fullText.length) { finishTyping(); return; }
  typeIdx++;
  renderLetter();
  const ch = fullText[typeIdx - 1];
  typeTimer = setTimeout(typeNext, ch === '\n' ? 260 : 70 + Math.random() * 70);
}
function finishTyping() {
  if (typingDone) return;
  typingDone = true; clearTimeout(typeTimer);
  typeIdx = fullText.length; renderLetter();
  $('btn-next').classList.remove('hidden');
  $('type-skip').classList.add('hidden');
}
letterCard.addEventListener('click', finishTyping);

/* ---------- 「第 N 天」滚动数字 ---------- */
function daysKnown() {
  const start = new Date(CONFIG.startDate + 'T00:00:00').getTime();
  return Math.max(0, Math.floor((Date.now() - start) / 86400000));
}
function animateDays() {
  const target = daysKnown(), el = $('days-num'), t0 = performance.now(), dur = 1800;
  (function step(t) {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(e * target).toLocaleString();
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}
$('known-since').textContent = '（' + CONFIG.startDate.replace(/-/g, '.') + ' 至今）';

/* ---------- 会逃跑的「让我想想」 ---------- */
const noBtn = $('btn-no'), yesBtn = $('btn-yes');
const noTexts = ['让我想想 🤔', '诶？它自己动了 😯', '别追了，再想想嘛', '这按钮有点慌了', '越来越小了…', '它是被压扁了吗 🫠', '其实答案只有一个啦'];
let dodges = 0;
function dodge(e) {
  if (e && e.cancelable) e.preventDefault();
  if (!noBtn.classList.contains('dodging')) {
    const r = noBtn.getBoundingClientRect();
    noBtn.style.left = r.left + 'px'; noBtn.style.top = r.top + 'px';
    noBtn.classList.add('dodging');
  }
  dodges++;
  noBtn.style.left = (6 + Math.random() * 76) + 'vw';
  noBtn.style.top = (10 + Math.random() * 74) + 'vh';
  noBtn.textContent = noTexts[Math.min(dodges, noTexts.length - 1)];
  yesBtn.style.setProperty('--s', (1 + dodges * 0.15).toFixed(2));
  noBtn.style.setProperty('--s', Math.max(0.35, 1 - dodges * 0.12).toFixed(2));
  if (dodges >= 7) {
    noBtn.style.opacity = '0'; noBtn.style.pointerEvents = 'none';
    $('no-hint').classList.remove('hidden');
  }
}
noBtn.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') dodge(e); });
noBtn.addEventListener('pointerdown', dodge);

/* ---------- 答应之后 ---------- */
let fireworksTimer = null, togetherTimer = null;
function fireworks() {
  spawnBurst(W / 2, H * 0.35, 36, 1.3);
  let n = 0;
  clearInterval(fireworksTimer);
  fireworksTimer = setInterval(() => {
    spawnBurst(W * (0.12 + Math.random() * 0.76), H * (0.18 + Math.random() * 0.5), 20 + ((Math.random() * 14) | 0), 1);
    if (++n >= 14) clearInterval(fireworksTimer);
  }, 330);
}
function initFinal(iso) {
  const d = new Date(iso);
  $('mem-date').textContent = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 ' +
    String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  $('sign').textContent = CONFIG.sign;
  clearInterval(togetherTimer);
  const upd = () => {
    const s = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
    $('together').textContent = '我们已经在一起 ' + Math.floor(s / 86400) + ' 天 ' +
      String(Math.floor(s % 86400 / 3600)).padStart(2, '0') + ' 小时 ' +
      String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ' 分 ' +
      String(s % 60).padStart(2, '0') + ' 秒';
  };
  upd(); togetherTimer = setInterval(upd, 1000);
}
yesBtn.addEventListener('click', () => {
  // 只记录第一次点「我愿意」的时刻；重温时再点不会清零，计时从最初那一刻继续
  let iso = null;
  try { iso = localStorage.getItem('lovtime'); } catch (_) {}
  if (!iso) {
    iso = new Date().toISOString();
    try { localStorage.setItem('lovtime', iso); } catch (_) {}
  }
  showScene('final');
  initFinal(iso);
  fireworks();
});

/* ---------- 回忆相册 ---------- */
const stackEl = $('card-stack'), dotsEl = $('mem-dots');
let memFlipped = 0;
function initMemories() {
  closeLightbox();
  stackEl.innerHTML = ''; dotsEl.innerHTML = '';
  memFlipped = 0;
  $('mem-end').classList.add('hidden');
  $('mem-hint').classList.remove('hidden');
  dotsEl.classList.remove('hidden');
  CONFIG.photos.forEach((p, idx) => {
    const card = document.createElement('div');
    card.className = 'mem-card';
    card.style.opacity = '0';
    const tape = document.createElement('div');
    tape.className = 'tape';
    tape.textContent = p.tag || '回忆';
    card.appendChild(tape);
    const img = new Image();
    img.alt = '我们的回忆';
    img.src = p.src;
    img.addEventListener('error', () => {
      img.remove();
      card.querySelector('.mem-caption').textContent =
        '这张回忆走丢了（要把 ' + p.src + ' 和 index.html 放在同一个文件夹里哦）';
    });
    card.appendChild(img);
    const cap = document.createElement('div');
    cap.className = 'mem-caption';
    cap.textContent = p.caption || '';
    card.appendChild(cap);
    // 放大镜按钮：点它看大图（不会触发翻卡）
    const zbtn = document.createElement('button');
    zbtn.type = 'button';
    zbtn.className = 'zoom-btn';
    zbtn.title = '放大查看这张回忆';
    zbtn.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#fff" stroke-width="2.2"/><line x1="15.6" y1="15.6" x2="21" y2="21" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';
    zbtn.addEventListener('click', e => { e.stopPropagation(); openLightbox(p); });
    card.appendChild(zbtn);
    card.addEventListener('click', () => flipCard(card));
    stackEl.appendChild(card);
  });
  requestAnimationFrame(() => requestAnimationFrame(layoutCards));
  renderDots();
}
function layoutCards() {
  const cards = [...stackEl.children].filter(c => !c.classList.contains('gone'));
  cards.forEach((c, i) => {
    c.style.zIndex = 100 - i;
    c.style.opacity = i > 2 ? '0' : '1';
    c.style.transform = 'translate(-50%,-50%) translateY(' + (i * 16) + 'px) scale(' +
      (1 - i * 0.05).toFixed(2) + ') rotate(' + ((i % 2 ? 1 : -1) * (i === 0 ? 1.5 : 2.5 + i)) + 'deg)';
  });
}
function flipCard(card) {
  const remaining = [...stackEl.children].filter(c => !c.classList.contains('gone'));
  if (remaining[0] !== card) return; // 只能翻最上面那张
  const r = card.getBoundingClientRect();
  spawnBurst(r.left + r.width / 2, r.top + r.height / 2, 16, 1);
  card.classList.add('gone');
  const dir = Math.random() < 0.5 ? -1 : 1;
  card.style.transform = 'translate(-50%,-50%) translate(' + dir * 46 + 'vw, -62vh) rotate(' + dir * 42 + 'deg) scale(.72)';
  card.style.opacity = '0';
  memFlipped++;
  setTimeout(() => {
    card.remove();
    layoutCards();
    renderDots();
    if (![...stackEl.children].some(c => !c.classList.contains('gone'))) {
      $('mem-hint').classList.add('hidden');
      dotsEl.classList.add('hidden');
      $('mem-end').classList.remove('hidden');
    }
  }, 620);
}
function renderDots() {
  dotsEl.innerHTML = '';
  CONFIG.photos.forEach((_, i) => {
    const s = document.createElement('span');
    if (i < memFlipped) s.classList.add('on');
    dotsEl.appendChild(s);
  });
}

/* ---------- 大图灯箱 ---------- */
const lb = $('lightbox'), lbImg = $('lb-img'), lbBody = $('lb-body');
let lbZoomed = false;
function openLightbox(p) {
  stopGalAuto();
  lbImg.src = p.src;
  $('lb-cap').textContent = (p.tag ? '「' + p.tag + '」 ' : '') + (p.caption || '');
  setLbZoom(false);
  lb.classList.remove('hidden');
}
function setLbZoom(z) {
  lbZoomed = z;
  lb.classList.toggle('zoomed', z);
  $('lb-toggle').textContent = z ? '↩ 缩回整图' : '🔍 放大看大图';
}
function closeLightbox() {
  lb.classList.add('hidden');
  lbBody.scrollTop = 0; lbBody.scrollLeft = 0;
  setLbZoom(false);
}
lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
$('lb-close').addEventListener('click', closeLightbox);
$('lb-toggle').addEventListener('click', () => setLbZoom(!lbZoomed));
lbImg.addEventListener('click', () => setLbZoom(!lbZoomed));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

/* ---------- 人像画廊：每一个阶段的你 ---------- */
const galImg = $('gal-img'), galCap = $('gal-cap'), galDots = $('gal-dots');
const gal = { idx: 0, timer: null, list: CONFIG.portraits || [] };
function initGallery() {
  gal.idx = 0;
  stopGalAuto();
  renderGalDots();
  showGal(0, true);
  $('btn-gal-done').classList.add('hidden');
  $('btn-gal-skip').classList.remove('hidden');
  gal.timer = setInterval(() => {
    if (gal.idx < gal.list.length - 1) galNext(false);
    else stopGalAuto();
  }, 4500);
}
function stopGalAuto() { clearInterval(gal.timer); gal.timer = null; }
function showGal(i, instant) {
  gal.idx = i;
  const p = gal.list[i];
  const apply = () => {
    galImg.src = p.src;
    galCap.textContent = p.caption || '';
    galCap.style.opacity = 1;
    galImg.classList.remove('fading');
    renderGalDots();
    if (i === gal.list.length - 1) {
      $('btn-gal-done').classList.remove('hidden');
      $('btn-gal-skip').classList.add('hidden');
    }
  };
  if (instant) { apply(); return; }
  galImg.classList.add('fading');
  galCap.style.opacity = 0;
  setTimeout(apply, 460);
}
function galNext(manual) {
  if (manual) stopGalAuto();
  if (gal.idx < gal.list.length - 1) showGal(gal.idx + 1);
}
function galPrev() {
  stopGalAuto();
  if (gal.idx > 0) showGal(gal.idx - 1);
}
function renderGalDots() {
  galDots.innerHTML = '';
  gal.list.forEach((_, i) => {
    const s = document.createElement('span');
    if (i === gal.idx) s.classList.add('on');
    galDots.appendChild(s);
  });
}
$('gal-next').addEventListener('click', () => galNext(true));
$('gal-prev').addEventListener('click', galPrev);
galImg.addEventListener('error', () => {
  galCap.textContent = '这张照片走丢了（要把 ' + (gal.list[gal.idx] || {}).src + ' 和 index.html 放在同一个文件夹里哦）';
});
galImg.addEventListener('click', () => openLightbox({ src: gal.list[gal.idx].src, tag: '', caption: gal.list[gal.idx].caption }));
// 触屏左右滑动切换
let galTouchX = null;
$('gal-stage').addEventListener('touchstart', e => { galTouchX = e.touches[0].clientX; }, { passive: true });
$('gal-stage').addEventListener('touchend', e => {
  if (galTouchX === null) return;
  const dx = e.changedTouches[0].clientX - galTouchX;
  if (dx > 42) galPrev(); else if (dx < -42) galNext(true);
  galTouchX = null;
}, { passive: true });

/* ---------- 流程 ---------- */
function startLetter() {
  closeLightbox();
  showScene('letter');
  typingDone = false; typeIdx = 0; clearTimeout(typeTimer);
  $('btn-next').classList.add('hidden');
  $('type-skip').classList.remove('hidden');
  renderLetter(); typeNext();
}
$('btn-open').addEventListener('click', () => {
  playBgm();
  if (CONFIG.photos && CONFIG.photos.length) { showScene('memories'); initMemories(); }
  else if (CONFIG.portraits && CONFIG.portraits.length) { showScene('gallery'); initGallery(); }
  else startLetter();
});
$('btn-to-gallery').addEventListener('click', () => { showScene('gallery'); initGallery(); });
$('btn-gal-done').addEventListener('click', startLetter);
$('btn-gal-skip').addEventListener('click', startLetter);
$('btn-next').addEventListener('click', () => { showScene('question'); animateDays(); });
$('btn-replay').addEventListener('click', () => {
  try { sessionStorage.setItem('replay', '1'); } catch (_) {}
  location.reload();
});

/* 打开页面时：如果她已经答应过，直接进入纪念日画面 */
(function init() {
  let replay = false, saved = null;
  try { replay = !!sessionStorage.getItem('replay'); } catch (_) {}
  try { saved = localStorage.getItem('lovetime'); } catch (_) {}
  if (saved && !replay) {
    showScene('final');
    initFinal(saved);
    setTimeout(() => spawnBurst(W / 2, H * 0.4, 24, 1), 600);
  } else {
    showScene('start');
  }
})();
</script>
